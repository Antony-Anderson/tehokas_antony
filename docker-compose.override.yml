services:
  tehokas:
    build:
      target: development
    environment:
      - APP_ENV=development
    volumes:
      - .:/var/www

  tehokas_nginx:
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tehokas.rule=Host(`tehokas.127.0.0.1.nip.io`)"
      - "traefik.http.routers.tehokas.entrypoints=web"
      - "traefik.http.services.tehokas.loadbalancer.server.port=80"
      - "traefik.docker.network=server_infra_traefik"

  node:
    image: node:22-alpine
    container_name: tehokas_node
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    networks:
      - default

volumes:
  node_modules: